name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run verify
        run: bash scripts/verify.sh
      - name: Test pro-notify without network
        run: python3 -B -m unittest discover -s skills/pro-notify/tests -v
