<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>pro-pick</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --panel-2: #f7f7f5; --line: #e4e3df; --line-strong: #cfcdc7;
    --ink: #1a1a18; --ink-2: #4b4a46; --ink-3: #8a887f;
    --accent: #0f6b3f; --accent-soft: #e6f3ec; --accent-ink: #0b4f2e;
    --reject: #a8321f; --reject-soft: #fbeae6; --reject-ink: #7f2516;
    --ai: #5b4bb5; --ai-soft: #efecfa;
    --t-image: #2563eb; --t-audio: #c2410c; --t-video: #b91c5c; --t-html: #0e7490; --t-text: #6d5a2b;
    --focus: #1a1a18;
    --radius: 10px; --radius-s: 6px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px -12px rgba(0,0,0,.18);
    --side-w: 280px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --panel-2: #232321; --line: #2c2c29; --line-strong: #3d3c38;
      --ink: #ecebe6; --ink-2: #b7b5ad; --ink-3: #7e7c74;
      --accent: #5cc48d; --accent-soft: #163124; --accent-ink: #9fe1bf;
      --reject: #ee7a63; --reject-soft: #3a1f19; --reject-ink: #f5b3a4;
      --ai: #a99bf0; --ai-soft: #26224a;
      --t-image: #7aa7ff; --t-audio: #f59e6b; --t-video: #f472a8; --t-html: #5ed0e6; --t-text: #d4b46a;
      --focus: #ecebe6;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 24px; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  svg.i { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.15em; flex: none; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 100vh; }
  aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  main { padding: 32px 40px 120px; max-width: 1180px; width: 100%; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    aside .nav, aside .side-foot { display: none; }
    main { padding: 20px 16px 120px; }
  }

  /* ---------- sidebar ---------- */
  .brand { padding: 22px 22px 16px; border-bottom: 1px solid var(--line); }
  .brand .kicker { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .brand .kicker svg { color: var(--accent); font-size: 14px; }
  .brand h1 { font-size: 17px; font-weight: 650; margin: 0 0 8px; line-height: 1.35; letter-spacing: -.01em; }
  .brand .meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .chip svg { color: var(--ink-3); }
  .progress { padding: 16px 22px; border-bottom: 1px solid var(--line); }
  .progress .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
  .progress .row span { display: inline-flex; align-items: center; gap: 5px; }
  .progress .row b { font-size: 20px; font-weight: 650; color: var(--ink); letter-spacing: -.02em; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; transition: width .25s ease; }
  .bar .c { background: var(--accent); }
  .bar .m { background: var(--reject); }
  .legend { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: var(--ink-3); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend .c svg { color: var(--accent); } .legend .m svg { color: var(--reject); }
  .nav { flex: 1; padding: 10px 12px; overflow-y: auto; }
  .nav .nav-h { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 6px 10px 8px; }
  .nav a { display: grid; grid-template-columns: 14px 16px 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: var(--radius-s); color: var(--ink-2); text-decoration: none; font-size: 13px; }
  .nav a:hover { background: var(--panel-2); color: var(--ink); }
  .nav a.active { background: var(--panel-2); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--ink); }
  .nav a .st { font-size: 14px; color: var(--line-strong); display: grid; place-items: center; }
  .nav a.chosen .st { color: var(--accent); }
  .nav a.more .st { color: var(--reject); }
  .nav a .ty { font-size: 14px; color: var(--ink-3); display: grid; place-items: center; }
  .nav a .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav a .id { font-size: 11px; color: var(--ink-3); }
  .side-foot { padding: 14px 22px 18px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-3); line-height: 1.9; }
  .side-foot .h { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-weight: 600; margin-bottom: 2px; }
  kbd { font: 11px ui-monospace, Menlo, Consolas, monospace; background: var(--panel-2); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink-2); }

  /* ---------- slot ---------- */
  .intro { margin: 0 0 28px; color: var(--ink-2); font-size: 14px; max-width: 66ch; display: flex; gap: 10px; align-items: flex-start; }
  .intro svg { color: var(--ink-3); font-size: 18px; margin-top: 3px; }
  .slot { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 28px; overflow: hidden; transition: border-color .15s ease; }
  .slot.current { border-color: var(--line-strong); }
  .slot.chosen { border-color: var(--accent); }
  .slot.more { border-color: var(--reject); }
  .slot-head { padding: 20px 24px 16px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
  .slot-head .title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .slot-head .ty { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 17px; background: var(--panel-2); border: 1px solid var(--line); }
  .slot-head .ty.image { color: var(--t-image); } .slot-head .ty.audio { color: var(--t-audio); } .slot-head .ty.video { color: var(--t-video); } .slot-head .ty.html { color: var(--t-html); } .slot-head .ty.text { color: var(--t-text); } .slot-head .ty.mixed { color: var(--ink-2); }
  .slot-head .idx { font-size: 11.5px; color: var(--ink-3); font-weight: 500; letter-spacing: .04em; }
  .slot-head h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.01em; line-height: 1.3; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: var(--panel-2); color: var(--ink-3); border: 1px solid var(--line); align-self: center; }
  .pill.chosen { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
  .pill.more { background: var(--reject-soft); color: var(--reject-ink); border-color: transparent; }
  .facts { grid-column: 1 / -1; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 13.5px; margin-top: 8px; }
  .facts dt { color: var(--ink-3); display: inline-flex; align-items: center; gap: 5px; }
  .facts dd { margin: 0; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
  .suggest { grid-column: 1 / -1; margin-top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--ai-soft); color: var(--ink-2); border-radius: var(--radius-s); padding: 10px 12px; font-size: 13px; border-left: 3px solid var(--ai); }
  .suggest .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--ai); padding-top: 2px; white-space: nowrap; }

  /* ---------- candidates ---------- */
  .cands { padding: 4px 24px 20px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .cands.n1 { grid-template-columns: 1fr; }
  .cands.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cands.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 700px) { .cands.n2, .cands.n3 { grid-template-columns: 1fr; } }
  .cand { position: relative; display: flex; flex-direction: column; background: var(--panel-2); border: 1.5px solid var(--line); border-radius: var(--radius-s); overflow: hidden; cursor: pointer; transition: border-color .12s ease, box-shadow .12s ease; }
  .cand:hover { border-color: var(--line-strong); }
  .cand.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .cand .key { position: absolute; top: 8px; left: 8px; z-index: 2; min-width: 22px; height: 22px; padding: 0 6px; display: grid; place-items: center; border-radius: 5px; font-size: 11.5px; font-weight: 700; background: rgba(255,255,255,.92); color: var(--ink); border: 1px solid var(--line); }
  .cand .badge { position: absolute; top: 8px; right: 8px; z-index: 2; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,.92); border: 1px solid var(--line); }
  @media (prefers-color-scheme: dark) { .cand .key, .cand .badge { background: rgba(20,20,19,.85); } }
  .cand .badge.image { color: var(--t-image); } .cand .badge.audio { color: var(--t-audio); } .cand .badge.video { color: var(--t-video); } .cand .badge.html { color: var(--t-html); } .cand .badge.text { color: var(--t-text); }
  .cand.on .key { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cand .media { position: relative; background: var(--panel); border-bottom: 1px solid var(--line); }
  .cand .media.image { aspect-ratio: 16 / 10; display: grid; place-items: center; overflow: hidden; }
  .cand .media.image img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cand .media.video video { width: 100%; display: block; background: #000; max-height: 360px; }
  .cand .media.audio { padding: 30px 16px 18px; display: grid; gap: 12px; place-items: center; }
  .cand .media.audio audio { width: 100%; }
  .cand .media.audio .wave { display: flex; gap: 3px; align-items: center; height: 30px; }
  .cand .media.audio .wave i { width: 3px; border-radius: 2px; background: var(--t-audio); opacity: .55; display: block; }
  .cand .media.html iframe { width: 100%; height: 300px; border: 0; display: block; background: #fff; }
  .cand .media.html.tall iframe { height: 620px; }
  .cand .media.text { padding: 26px 22px 20px; min-height: 130px; display: grid; align-content: center; position: relative; }
  .cand .media.text::before { content: "“"; position: absolute; top: 6px; left: 14px; font-size: 56px; line-height: 1; color: var(--t-text); opacity: .22; font-family: Georgia, "Songti SC", serif; }
  .cand .media.text p { margin: 0; font-size: 16px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; position: relative; }
  .cand .body { padding: 10px 12px 12px; display: grid; gap: 5px; }
  .cand .lbl { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
  .cand .lbl .check { margin-left: auto; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; flex: none; color: transparent; font-size: 11px; }
  .cand.on .lbl .check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cand .src { font-size: 11.5px; color: var(--ink-3); display: flex; gap: 10px; flex-wrap: wrap; }
  .cand .src span { display: inline-flex; align-items: center; gap: 4px; }
  .cand .src .lic.unknown { color: var(--reject); }
  .cand .tools { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .cand .tools a, .cand .tools button { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; text-decoration: none; }
  .cand .tools a:hover, .cand .tools button:hover { border-color: var(--line-strong); color: var(--ink); }

  /* ---------- actions ---------- */
  .acts { padding: 14px 24px 20px; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; background: var(--panel); }
  @media (max-width: 700px) { .acts { grid-template-columns: 1fr; } }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--radius-s); padding: 8px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .btn:hover { border-color: var(--ink-3); }
  .btn.reject.on { background: var(--reject); border-color: var(--reject); color: #fff; }
  .btn.approve { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.approve.off { background: var(--panel); color: var(--ink); border-color: var(--line-strong); }
  .btn-group { display: flex; gap: 8px; }
  .note { position: relative; }
  .note svg { position: absolute; left: 11px; top: 12px; color: var(--ink-3); font-size: 14px; pointer-events: none; }
  .note textarea { width: 100%; min-height: 40px; max-height: 240px; resize: none; padding: 9px 12px 9px 32px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-s); line-height: 1.55; }
  .note textarea:focus { background: var(--panel); border-color: var(--line-strong); outline: none; box-shadow: 0 0 0 3px var(--panel-2); }
  .note textarea::placeholder { color: var(--ink-3); }

  /* ---------- export dock ---------- */
  .dock { position: fixed; left: var(--side-w); right: 0; bottom: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px -16px rgba(0,0,0,.25); }
  @media (max-width: 900px) { .dock { left: 0; } }
  .dock-bar { max-width: 1180px; margin: 0 auto; padding: 12px 40px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  @media (max-width: 900px) { .dock-bar { padding: 10px 16px; } }
  .dock-bar .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); margin-right: auto; }
  .dock-bar .status svg { font-size: 16px; }
  .dock-bar .status b { color: var(--ink); }
  .dock-bar .status.ok svg { color: var(--accent); }
  .dock-bar .status.warn svg { color: var(--reject); }
  .dock-bar .status .warn { color: var(--reject); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 6px 10px; font-size: 12.5px; font-weight: 500; }
  .dock-body { display: none; border-top: 1px solid var(--line); }
  .dock.open .dock-body { display: block; }
  .dock-body .inner { max-width: 1180px; margin: 0 auto; padding: 14px 40px 18px; }
  @media (max-width: 900px) { .dock-body .inner { padding: 12px 16px 16px; } }
  .dock-body textarea { width: 100%; height: 220px; resize: vertical; padding: 12px 14px; font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-s); color: var(--ink-2); }
  .dock-body .hint { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: var(--ink-3); margin: 8px 0 0; }
  .dock-body .hint svg { margin-top: 3px; }
  .toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(8px); z-index: 30; display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .18s ease; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- lightbox ---------- */
  .lb { position: fixed; inset: 0; z-index: 100; background: rgba(12,12,11,.93); display: none; flex-direction: column; color: #eee; }
  .lb.open { display: flex; }
  .lb-top { display: flex; align-items: center; gap: 12px; padding: 14px 20px; font-size: 13px; }
  .lb-top .t { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .lb-top .s { color: #aaa; }
  .lb-top button { display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 1px solid #444; color: #ddd; border-radius: 6px; padding: 5px 10px; font-size: 12.5px; }
  .lb-top .sp { margin-left: auto; }
  .lb-stage { flex: 1; display: grid; place-items: center; padding: 0 64px 12px; position: relative; min-height: 0; }
  .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 1px solid #444; background: rgba(30,30,28,.8); color: #eee; font-size: 18px; display: grid; place-items: center; }
  .lb-nav.prev { left: 12px; } .lb-nav.next { right: 12px; }
  .lb-nav:disabled { opacity: .25; cursor: default; }
  .lb-strip { display: flex; gap: 8px; justify-content: center; padding: 10px 20px 18px; overflow-x: auto; }
  .lb-strip button { flex: none; width: 88px; height: 56px; padding: 0; border-radius: 4px; overflow: hidden; border: 2px solid transparent; background: #222; }
  .lb-strip button.on { border-color: #fff; }
  .lb-strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lb-pick { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }

  .empty { padding: 60px 24px; text-align: center; color: var(--ink-3); display: grid; gap: 8px; justify-items: center; }
  .empty svg { font-size: 32px; }

  /* ---------- scrollbars ---------- */
  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  body::-webkit-scrollbar-thumb { border-color: var(--bg); }
  .lb ::-webkit-scrollbar-thumb { background: #555; background-clip: padding-box; }
  .lb * { scrollbar-color: #555 transparent; }

  /* ---------- modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(12,12,11,.55); backdrop-filter: blur(4px); }
  .modal.open { display: flex; }
  .modal-card { width: min(440px, 100%); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); overflow: hidden; transform: translateY(6px) scale(.98); opacity: 0; transition: transform .16s ease, opacity .16s ease; }
  .modal.open .modal-card { transform: none; opacity: 1; }
  .modal-body { padding: 22px 24px 8px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
  .modal-ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 19px; background: var(--panel-2); color: var(--ink-2); }
  .modal.danger .modal-ico { background: var(--reject-soft); color: var(--reject); }
  .modal.warn .modal-ico { background: #fff4e0; color: #b45309; }
  @media (prefers-color-scheme: dark) { .modal.warn .modal-ico { background: #3a2a10; color: #f5b556; } }
  .modal h3 { margin: 0 0 6px; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
  .modal p { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.6; }
  .modal-acts { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 24px 20px; }
  .modal-acts .btn kbd { margin-left: 6px; opacity: .8; }
  .modal.danger .btn.primary { background: var(--reject); border-color: var(--reject); color: #fff; }
</style>
</head>

<script id="manifest" type="application/json">
{"id":"example","topic":"示例","round":1,"slots":[]}
</script>

<div class="app">
  <aside>
    <div class="brand">
      <div class="kicker"><i data-i="layers"></i>pro-pick</div>
      <h1 id="topic"></h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="progress">
      <div class="row"><span><i data-i="gauge"></i>已处理</span><b id="pct">0 / 0</b></div>
      <div class="bar"><i class="c" id="barC" style="width:0"></i><i class="m" id="barM" style="width:0"></i></div>
      <div class="legend"><span class="c"><i data-i="check-circle"></i>已选</span><span class="m"><i data-i="undo"></i>打回</span><span><i data-i="circle"></i>未处理</span></div>
    </div>

    <div class="side-foot">
      <div class="h"><i data-i="keyboard"></i>键盘</div>
      <div><kbd>J</kbd> / <kbd>K</kbd> 上下切换接入点</div>
      <div><kbd>1</kbd>–<kbd>9</kbd> 选候选 · <kbd>X</kbd> 打回 · <kbd>N</kbd> 批注</div>
      <div><kbd>Enter</kbd> 放大图片 · <kbd>Esc</kbd> 关闭</div>
    </div>
  </aside>

  <main>
    <p class="intro" id="intro"></p>
    <div id="list"></div>
  </main>
</div>

<div class="dock" id="dock">
  <div class="dock-bar">
    <div class="status" id="dockStatus"></div>
    <button class="btn small ghost" id="btnReset"><i data-i="trash"></i>清空记录</button>
    <button class="btn small" id="btnPreview"><i data-i="braces"></i><span>查看 JSON</span></button>
    <button class="btn small" id="btnDownload"><i data-i="download"></i>下载 result.json</button>

  </div>
  <div class="dock-body">
    <div class="inner">
      <textarea id="out" readonly spellcheck="false"></textarea>
      <p class="hint"><i data-i="info"></i><span>把 result.json 放回本目录，或把内容贴回对话。未处理的接入点导出为 chosen: null、more: false，AI 不会接入也不会补候选。</span></p>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="modal" id="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <div class="modal-body">
      <div class="modal-ico" id="modalIco"></div>

    </div>
    <div class="modal-acts">

      <button class="btn small primary" id="modalOk"></button>
    </div>
  </div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <div class="lb-top"><span class="t"><i data-i="image"></i><span id="lbTitle"></span></span><span class="s" id="lbSub"></span><button class="sp" id="lbPick"></button><button id="lbClose"><i data-i="x"></i>关闭 <kbd>Esc</kbd></button></div>
  <div class="lb-stage">

    <img id="lbImg" alt="">

  </div>
  <div class="lb-strip" id="lbStrip"></div>
</div>

    'copy': '<rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
    'download': '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
    'braces': '<path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/>',
    'trash': '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',

    'external': '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    'expand': '<path d="m7 6 5 5 5-5"/><path d="m7 13 5 5 5-5"/>',
    'collapse': '<path d="m7 18 5-5 5 5"/><path d="m7 11 5-5 5 5"/>',
    'tag': '<path d="M12.6 2.9a2 2 0 0 1 1.4-.6h5.2a2 2 0 0 1 2 2v5.2a2 2 0 0 1-.6 1.4l-9.6 9.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8Z"/><circle cx="16.5" cy="7.5" r="1"/>',
    'shield': '<path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1 1 0 0 1 1.6 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/>',
    'pen': '<path d="M12 20h9"/><path d="M16.4 3.6a2 2 0 1 1 2.8 2.8L7.5 18.1 3 19l.9-4.5Z"/>',
    'info': '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
    'compass': '<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/>',
    'chevron-left': '<path d="m15 18-6-6 6-6"/>',
    'chevron-right': '<path d="m9 18 6-6-6-6"/>',
    'alert': '<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    'inbox': '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1"/>'
  };
  function icon(name, cls) { return '<svg class="i' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.circle) + '</svg>'; }
  function iconEl(name, cls) { var s = document.createElement('span'); s.innerHTML = icon(name, cls); return s.firstChild; }
  document.querySelectorAll('i[data-i]').forEach(function (p) { p.outerHTML = icon(p.dataset.i); });

  var TYPE_LABEL = { image: '图片', audio: '音频', video: '视频', html: '页面', text: '文本' };

  /* ---------- data ---------- */
  var M = JSON.parse(document.getElementById('manifest').textContent);
  var slots = M.slots || [];
  var KEY = 'pro-pick:' + M.id + ':r' + (M.round || 1);
  var state = load();
  var current = 0;

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function withIcon(node, name, text) { node.appendChild(iconEl(name)); node.appendChild(document.createTextNode(text)); return node; }
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
  function st(id) { return state[id] || (state[id] = {}); }
  function statusOf(s) { var x = state[s.id] || {}; return x.more ? 'more' : (x.chosen ? 'chosen' : ''); }
  function slotType(s) {
    var types = {}; (s.candidates || []).forEach(function (c) { types[c.type || 'text'] = 1; });
    var keys = Object.keys(types); return keys.length === 1 ? keys[0] : 'mixed';
  }

  /* ---------- header ---------- */
  var total = slots.reduce(function (n, s) { return n + (s.candidates || []).length; }, 0);
  $('topic').textContent = M.topic || M.id;
  var meta = $('meta');
  meta.appendChild(withIcon(el('span', 'chip'), 'undo', '第 ' + (M.round || 1) + ' 轮'));
  meta.appendChild(withIcon(el('span', 'chip'), 'list', slots.length + ' 个接入点'));
  meta.appendChild(withIcon(el('span', 'chip'), 'mixed', total + ' 个候选'));
  if (slots.length) {
    var intro = $('intro'); intro.appendChild(iconEl('compass'));
    intro.appendChild(el('span', null, '每个接入点选一个候选，或打回让 AI 再找。想说明怎么改就写在批注里。选择会自动保存在这个浏览器里，随时可以回来继续。'));
  }

  /* ---------- nav ---------- */
  var nav = $('nav');
  slots.forEach(function (s, i) {
    var a = el('a'); a.href = '#slot-' + s.id; a.dataset.i = i;
    a.appendChild(el('span', 'st'));
    var ty = el('span', 'ty'); ty.appendChild(iconEl(slotType(s))); a.appendChild(ty);
    a.appendChild(el('span', 'name', s.name || s.id));
    a.appendChild(el('span', 'id mono', s.id));
    a.onclick = function (ev) { ev.preventDefault(); go(i); };
    nav.appendChild(a);
  });
  function paintNav() {
    var links = nav.querySelectorAll('a');
    links.forEach(function (a, i) {
      var status = statusOf(slots[i]);
      a.className = status + (i === current ? ' active' : '');
      var stEl = a.querySelector('.st'); stEl.innerHTML = icon(status === 'chosen' ? 'check-circle' : status === 'more' ? 'undo' : 'circle-dashed');
    });
  }

  /* ---------- progress ---------- */
  function progress() {
    var c = 0, m = 0;
    slots.forEach(function (s) { var x = statusOf(s); if (x === 'chosen') c++; else if (x === 'more') m++; });
    var done = c + m, n = slots.length || 1;
    $('pct').textContent = done + ' / ' + slots.length;
    $('barC').style.width = (c / n * 100) + '%';
    $('barM').style.width = (m / n * 100) + '%';
    var left = slots.length - done, ds = $('dockStatus');
    ds.className = 'status ' + (left ? 'warn' : 'ok');
    ds.innerHTML = left
      ? icon('alert') + '<span><b>' + done + '</b> / ' + slots.length + ' 已处理，<span class="warn">还有 ' + left + ' 个未处理</span></span>'
      : icon('check-circle') + '<span><b>全部 ' + slots.length + ' 个接入点已处理</b>，可以导出了</span>';
    paintNav();
  }

  /* ---------- media ---------- */
  function media(c) {
    var t = c.type || 'text', box = el('div', 'media ' + t);
    if (t === 'image') { var img = el('img'); img.src = c.src; img.alt = c.label || ''; img.loading = 'lazy'; box.appendChild(img); }
    else if (t === 'video') { var v = el('video'); v.controls = true; v.src = c.src; v.preload = 'metadata'; box.appendChild(v); }
    else if (t === 'audio') {
      var w = el('div', 'wave');
      for (var i = 0; i < 32; i++) { var bar = el('i'); bar.style.height = (6 + Math.abs(Math.sin(i * 1.7) * 24)) + 'px'; w.appendChild(bar); }
      box.appendChild(w);
      var au = el('audio'); au.controls = true; au.src = c.src; au.preload = 'metadata'; box.appendChild(au);
    }
    else if (t === 'html') { var f = el('iframe'); f.src = c.src; f.loading = 'lazy'; f.title = c.label || c.id; box.appendChild(f); }
    else { box.appendChild(el('p', null, c.content != null ? c.content : (c.src || ''))); }
    return box;
  }

  function tools(c, slot, idx) {
    var t = el('div', 'tools');
    if (c.type === 'image') {
      var z = withIcon(el('button'), 'maximize', '放大');
      z.onclick = function (ev) { ev.stopPropagation(); openLb(slot, idx); }; t.appendChild(z);
    }
    if (c.type === 'html') {
      var h = withIcon(el('button'), 'expand', '展开高度');
      h.onclick = function (ev) {
        ev.stopPropagation(); var m = h.closest('.cand').querySelector('.media'); m.classList.toggle('tall');
        h.innerHTML = ''; withIcon(h, m.classList.contains('tall') ? 'collapse' : 'expand', m.classList.contains('tall') ? '收起高度' : '展开高度');
      };
      t.appendChild(h);
    }
    if (c.src && c.type !== 'text') {
      var a = withIcon(el('a'), 'external', '新窗口打开'); a.href = c.src; a.target = '_blank'; a.rel = 'noopener';
      a.onclick = function (ev) { ev.stopPropagation(); }; t.appendChild(a);
    }
    return t.children.length ? t : null;
  }

  /* ---------- slot ---------- */
  function renderSlot(s, i) {
    var cands = s.candidates || [];
    var single = cands.length === 1;
    var x = st(s.id);
    var card = el('section', 'slot'); card.id = 'slot-' + s.id; card.dataset.i = i;

    var head = el('div', 'slot-head');
    var title = el('div', 'title');
    var ty = el('span', 'ty ' + slotType(s)); ty.appendChild(iconEl(slotType(s))); title.appendChild(ty);
    var tt = el('div');
    tt.appendChild(el('div', 'idx mono', s.id));
    tt.appendChild(el('h2', null, s.name || ''));
    title.appendChild(tt);
    head.appendChild(title);
    var pill = el('span', 'pill'); head.appendChild(pill);
    var dl = el('dl', 'facts');
    [['pin', '场景', s.scene], ['ruler', '约束', s.constraints]].forEach(function (p) {
      if (!p[2]) return; dl.appendChild(withIcon(el('dt'), p[0], p[1])); dl.appendChild(el('dd', null, p[2]));
    });
    if (dl.children.length) head.appendChild(dl);
    if (s.suggestion) { var sg = el('div', 'suggest'); sg.appendChild(withIcon(el('span', 'tag'), 'sparkles', 'AI 建议')); sg.appendChild(el('div', null, s.suggestion)); head.appendChild(sg); }
    card.appendChild(head);

    var grid = el('div', 'cands n' + Math.min(cands.length, 3));
    cands.forEach(function (c, idx) {
      var t = c.type || 'text';
      var box = el('div', 'cand'); box.dataset.id = c.id; box.tabIndex = 0; box.setAttribute('role', 'radio');
      box.appendChild(el('span', 'key mono', String(idx + 1)));
      box.appendChild(withIcon(el('span', 'badge ' + t), t, TYPE_LABEL[t] || t));
      box.appendChild(media(c));
      var body = el('div', 'body');
      var lbl = el('div', 'lbl'); lbl.appendChild(document.createTextNode(c.label || c.id));
      var chk = el('span', 'check'); chk.appendChild(iconEl('check')); lbl.appendChild(chk); body.appendChild(lbl);
      var src = el('div', 'src');
      if (c.source) src.appendChild(withIcon(el('span'), 'tag', c.source));
      if (c.license) src.appendChild(withIcon(el('span', 'lic ' + (c.license === 'unknown' ? 'unknown' : '')), 'shield', c.license === 'unknown' ? '许可未知' : c.license));
      if (src.children.length) body.appendChild(src);
      var tl = tools(c, s, idx); if (tl) body.appendChild(tl);
      box.appendChild(body);
      box.onclick = function (ev) { if (ev.target.closest('audio,video,iframe,a,button')) return; choose(s, c.id); };
      box.onkeydown = function (ev) {
        if (ev.key === ' ' || (ev.key === 'Enter' && t !== 'image')) { ev.preventDefault(); choose(s, c.id); }
        if (ev.key === 'Enter' && t === 'image') { ev.preventDefault(); openLb(s, idx); }
      };
      grid.appendChild(box);
    });
    card.appendChild(grid);

    var acts = el('div', 'acts');
    var group = el('div', 'btn-group');
    var rejectBtn = withIcon(el('button', 'btn reject'), 'undo', single ? '打回，重做' : '都不要，再找');
    rejectBtn.onclick = function () { x.more = !x.more; if (x.more) x.chosen = null; save(); paint(); };
    var okBtn = null;
    if (single) { okBtn = withIcon(el('button', 'btn approve'), 'check', '通过'); okBtn.onclick = function () { choose(s, cands[0].id); }; group.appendChild(okBtn); }
    group.appendChild(rejectBtn);
    acts.appendChild(group);
    var note = el('div', 'note'); note.appendChild(iconEl('pen'));
    var ta = el('textarea'); ta.rows = 1;
    ta.placeholder = single ? '批注（可选）：哪里要改、改成什么样' : '批注（可选）：想要什么感觉、还差什么';
    ta.value = x.note || '';
    function grow() { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 240) + 'px'; }
    ta.oninput = function () { x.note = ta.value; save(); grow(); };
    ta.onfocus = function () { setCurrent(i, false); };
    note.appendChild(ta); acts.appendChild(note);
    card.appendChild(acts);
    requestAnimationFrame(grow);

    function paint() {
      var status = statusOf(s);
      card.className = 'slot ' + status + (i === current ? ' current' : '');
      pill.className = 'pill ' + status; pill.innerHTML = '';
      withIcon(pill, status === 'chosen' ? 'check-circle' : status === 'more' ? 'undo' : 'circle-dashed',
        status === 'chosen' ? (single ? '已通过' : '已选') : status === 'more' ? '已打回' : '未处理');
      grid.querySelectorAll('.cand').forEach(function (b) { var on = b.dataset.id === x.chosen; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
      rejectBtn.classList.toggle('on', !!x.more);

      progress();
    }
    card._paint = paint;
    paint();
    return card;
  }

  function choose(s, id) { var x = st(s.id); x.chosen = (x.chosen === id && (s.candidates || []).length > 1) ? null : id; x.more = false; save(); $('slot-' + s.id)._paint(); }

  var list = $('list');
  if (!slots.length) { var em = el('div', 'empty'); em.appendChild(iconEl('inbox')); em.appendChild(el('div', null, 'manifest 里没有接入点。')); list.appendChild(em); }
  slots.forEach(function (s, i) { list.appendChild(renderSlot(s, i)); });

  /* ---------- current slot tracking ---------- */
  var scrollLock = 0;
  function setCurrent(i, scroll) {
    if (i < 0 || i >= slots.length) return;
    var prev = current; current = i;
    if (prev !== i && slots[prev]) $('slot-' + slots[prev].id)._paint();
    $('slot-' + slots[i].id)._paint();
    if (scroll !== false) {
      // 程序滚动期间不让滚动跟踪抢回高亮，滚动结束（或超时）再恢复
      scrollLock++;
      var release = function () { scrollLock = Math.max(0, scrollLock - 1); window.removeEventListener('scrollend', release); trackCurrent(); };
      if ('onscrollend' in window) window.addEventListener('scrollend', release, { once: true });
      setTimeout(release, 700);
      $('slot-' + slots[i].id).scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
  }
  function go(i) { setCurrent(i, true); }

  // 当前项 = 第一个顶部仍在视野内的 slot；若整个视野都落在某个 slot 的范围里（它顶部已滚出），则取该 slot。
  var cards = Array.prototype.slice.call(list.querySelectorAll('.slot'));
  function trackCurrent() {
    if (scrollLock || !cards.length) return;
    var line = 24, pick = -1, inside = -1;
    for (var k = 0; k < cards.length; k++) {
      var r = cards[k].getBoundingClientRect();
      if (r.top >= line - 8) { pick = k; break; }
      if (r.bottom > line) inside = k;
    }
    if (pick < 0) pick = inside >= 0 ? inside : cards.length - 1;
    else if (inside >= 0 && cards[pick].getBoundingClientRect().top > window.innerHeight * 0.6) pick = inside;
    if (pick !== current) setCurrent(pick, false);
  }
  var trackRaf = 0;
  window.addEventListener('scroll', function () { if (!trackRaf) trackRaf = requestAnimationFrame(function () { trackRaf = 0; trackCurrent(); }); }, { passive: true });
  window.addEventListener('resize', trackCurrent);

  /* ---------- modal ---------- */
  var modal = $('modal'), modalResolve = null, modalPrevFocus = null;
  function ask(o) {
    return new Promise(function (resolve) {
      modalResolve = resolve; modalPrevFocus = document.activeElement;
      modal.className = 'modal ' + (o.kind || '');
      $('modalIco').innerHTML = icon(o.icon || (o.kind === 'danger' ? 'trash' : 'alert'));
      $('modalTitle').textContent = o.title || '';
      $('modalText').textContent = o.text || '';
      var ok = $('modalOk'), cancel = $('modalCancel');
      ok.innerHTML = ''; withIcon(ok, o.okIcon || 'check', o.ok || '确定'); ok.appendChild(el('kbd', null, 'Enter'));
      cancel.innerHTML = ''; withIcon(cancel, 'x', o.cancel || '取消'); cancel.appendChild(el('kbd', null, 'Esc'));
      modal.classList.add('open'); document.body.style.overflow = 'hidden';
      requestAnimationFrame(function () { ok.focus(); });
    });
  }
  function closeModal(v) {
    if (!modalResolve) return;
    modal.classList.remove('open'); document.body.style.overflow = lb.classList.contains('open') ? 'hidden' : '';
    var r = modalResolve; modalResolve = null; r(v);
    if (modalPrevFocus && modalPrevFocus.focus) modalPrevFocus.focus();
  }
  $('modalOk').onclick = function () { closeModal(true); };
  $('modalCancel').onclick = function () { closeModal(false); };
  modal.onclick = function (ev) { if (ev.target === modal) closeModal(false); };

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', function (ev) {
    if (modal.classList.contains('open')) {
      if (ev.key === 'Escape') { ev.preventDefault(); closeModal(false); }
      else if (ev.key === 'Enter') { ev.preventDefault(); closeModal(true); }
      else if (ev.key === 'Tab') { ev.preventDefault(); ($('modalOk') === document.activeElement ? $('modalCancel') : $('modalOk')).focus(); }
      return;
    }
    if (lb.classList.contains('open')) {
      if (ev.key === 'Escape') closeLb();
      if (ev.key === 'ArrowLeft') lbMove(-1);
      if (ev.key === 'ArrowRight') lbMove(1);
      if (ev.key === 'Enter') $('lbPick').click();
      return;
    }
    var tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'input') { if (ev.key === 'Escape') ev.target.blur(); return; }
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var s = slots[current]; if (!s) return;
    if (ev.key === 'j' || ev.key === 'J' || ev.key === 'ArrowDown') { ev.preventDefault(); go(current + 1); }
    else if (ev.key === 'k' || ev.key === 'K' || ev.key === 'ArrowUp') { ev.preventDefault(); go(current - 1); }
    else if (ev.key >= '1' && ev.key <= '9') { var c = (s.candidates || [])[+ev.key - 1]; if (c) choose(s, c.id); }
    else if (ev.key === 'x' || ev.key === 'X') { $('slot-' + s.id).querySelector('.btn.reject').click(); }
    else if (ev.key === 'n' || ev.key === 'N') { ev.preventDefault(); $('slot-' + s.id).querySelector('textarea').focus(); }
    else if (ev.key === 'Enter') {
      var imgs = imageIdx(s); if (!imgs.length) return;
      var chosenIdx = (s.candidates || []).findIndex(function (c) { return c.id === st(s.id).chosen && c.type === 'image'; });
      openLb(s, chosenIdx >= 0 ? chosenIdx : imgs[0]);
    }
  });

  /* ---------- lightbox ---------- */
  var lb = $('lb'), lbSlot = null, lbIdx = 0, lbImgs = [];
  function imageIdx(s) { return (s.candidates || []).map(function (c, i) { return c.type === 'image' ? i : -1; }).filter(function (i) { return i >= 0; }); }
  function openLb(s, idx) {
    lbSlot = s; lbImgs = imageIdx(s); lbIdx = Math.max(0, lbImgs.indexOf(idx));
    var strip = $('lbStrip'); strip.innerHTML = '';
    lbImgs.forEach(function (ci, k) {
      var b = el('button'); var im = el('img'); im.src = s.candidates[ci].src; im.alt = ''; b.appendChild(im);
      b.onclick = function () { lbIdx = k; lbShow(); }; strip.appendChild(b);
    });
    strip.style.display = lbImgs.length > 1 ? '' : 'none';
    lb.classList.add('open'); document.body.style.overflow = 'hidden'; lbShow();
  }
  function lbShow() {
    var c = lbSlot.candidates[lbImgs[lbIdx]];
    $('lbImg').src = c.src; $('lbImg').alt = c.label || '';
    $('lbTitle').textContent = (lbSlot.name || lbSlot.id) + ' · ' + (c.label || c.id);
    $('lbSub').textContent = (lbIdx + 1) + ' / ' + lbImgs.length + (c.source ? ' · 来源 ' + c.source : '');
    $('lbPrev').disabled = lbIdx === 0; $('lbNext').disabled = lbIdx === lbImgs.length - 1;
    var on = st(lbSlot.id).chosen === c.id, pk = $('lbPick');
    pk.innerHTML = ''; withIcon(pk, 'check', on ? '已选' : '选这个'); if (!on) { var k = el('kbd', null, 'Enter'); k.style.marginLeft = '4px'; pk.appendChild(k); }
    pk.classList.toggle('lb-pick', on);
    $('lbStrip').querySelectorAll('button').forEach(function (b, k) { b.classList.toggle('on', k === lbIdx); });
  }
  function lbMove(d) { var n = lbIdx + d; if (n < 0 || n >= lbImgs.length) return; lbIdx = n; lbShow(); }
  function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  $('lbPrev').onclick = function () { lbMove(-1); };
  $('lbNext').onclick = function () { lbMove(1); };
  $('lbClose').onclick = closeLb;
  $('lbPick').onclick = function () { var c = lbSlot.candidates[lbImgs[lbIdx]]; st(lbSlot.id).chosen = c.id; st(lbSlot.id).more = false; save(); $('slot-' + lbSlot.id)._paint(); lbShow(); };
  lb.querySelector('.lb-stage').onclick = function (ev) { if (ev.target === ev.currentTarget) closeLb(); };

  /* ---------- export ---------- */
  function result() {
    return { id: M.id, round: M.round || 1, decisions: slots.map(function (s) { var x = state[s.id] || {}; return { id: s.id, chosen: x.chosen || null, more: !!x.more, note: x.note || '' }; }) };
  }
  function json() { var t = JSON.stringify(result(), null, 2); $('out').value = t; return t; }
  function toast(msg) { var t = $('toast'); t.innerHTML = icon('check') + msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 1800); }
  function unresolved() { return slots.filter(function (s) { return !statusOf(s); }).length; }
  function confirmLeft() {
    var n = unresolved();
    return n ? ask({ kind: 'warn', title: '还有 ' + n + ' 个接入点未处理', text: '未处理的接入点会以 chosen: null、more: false 导出，AI 不会接入也不会补候选。现在就导出吗？', ok: '仍然导出', okIcon: 'download', cancel: '回去处理' })
             : Promise.resolve(true);
  }
  var dock = $('dock');
  $('btnPreview').onclick = function () { json(); dock.classList.toggle('open'); $('btnPreview').querySelector('span').textContent = dock.classList.contains('open') ? '收起 JSON' : '查看 JSON'; };
  $('btnCopy').onclick = function () {
    confirmLeft().then(function (go) {
      if (!go) return;
      var t = json(), done = function () { toast('已复制 result.json'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { fallbackCopy(t); done(); });
      else { fallbackCopy(t); done(); }
    });
  };
  function fallbackCopy(t) { var o = $('out'); o.value = t; dock.classList.add('open'); o.select(); try { document.execCommand('copy'); } catch (e) {} }
  $('btnDownload').onclick = function () {
    confirmLeft().then(function (go) {
      if (!go) return;
      var blob = new Blob([json()], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'result.json'; document.body.appendChild(a); a.click(); a.remove();
      toast('已下载 result.json');
    });
  };
  $('btnReset').onclick = function () {
    ask({ kind: 'danger', title: '清空本页所有选择和批注？', text: '会删除这个浏览器里保存的 ' + slots.length + ' 个接入点的选择与批注，此操作不可撤销。', ok: '清空', okIcon: 'trash', cancel: '取消' })
      .then(function (go) { if (go) { localStorage.removeItem(KEY); location.reload(); } });
  };

  progress();
})();
</script>
</body>
</html>
